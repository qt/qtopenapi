openapi: 3.0.1
info:
  description: This spec is mainly for testing Openapi 2.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  title: OpenAPI 2.0 test
  version: 1.0.0
servers:
- url: http://127.0.0.1:10300/v2
paths:
  /fake/test-query-parameters:
    post:
      description: To test the collection format in query parameters
      operationId: testQueryParameterCollectionFormat
      parameters:
      - in: query
        name: pipe
        required: true
        schema:
          items:
            type: string
          type: array
        style: pipeDelimited
      - in: query
        name: ioutil
        required: true
        schema:
          items:
            type: string
          type: array
      - in: query
        name: http
        required: true
        schema:
          items:
            type: string
          type: array
        style: spaceDelimited
      - explode: false
        in: query
        name: url
        required: true
        schema:
          items:
            type: string
          type: array
        style: form
      - explode: true
        in: query
        name: multiContext
        required: true
        schema:
          items:
            type: string
          type: array
        style: form
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: string
          description: Success
        "400":
          content: {}
          description: Not success
      tags:
      - fake
  /fake/test-path-parameters/{pipeId}/{ioutilId}/{httpId}/{urlId}/{multiContextId}:
    post:
      description: To test the collection format in path parameters
      operationId: testPathParameterCollectionFormat
      parameters:
      - in: path
        name: pipeId
        required: true
        schema:
          items:
            type: string
          type: array
      - in: path
        name: ioutilId
        required: true
        schema:
          items:
            type: string
          type: array
      - in: path
        name: httpId
        required: true
        schema:
          items:
            type: string
          type: array
      - explode: false
        in: path
        name: urlId
        required: true
        schema:
          items:
            type: string
          type: array
        style: simple
      - in: path
        name: multiContextId
        required: true
        schema:
          items:
            type: string
          type: array
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: string
          description: Success
        "400":
          content: {}
          description: Not success
      tags:
      - fake
components:
  schemas: {}
x-original-swagger-version: "2.0"
