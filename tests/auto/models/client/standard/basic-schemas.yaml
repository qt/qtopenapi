openapi: 3.1.0
servers:
    - url: 'http://127.0.0.1:19085/v2'
info:
  title: Some Test
  description: >
    This specification is intended for testing purposes.
  version: 1.0.0
tags:
  - name: data
    description: test data

paths:
  /newAccount:
    post:
      tags:
        - data
      operationId: postAccount
      requestBody:
        content:
          application/json:
            schema:
              # here testing the inline model
              # (declaration is directly in the request)
              type: object
              required: [cardNumber]
              # fields use all standard data types:
              # (integer, double, float, string, array, object)
              properties:
                cardNumber:
                  type: string
                cardData:
                  type: integer
                cardAvailability:
                  type: boolean
                cardSecretCode:
                  type: number
                  format: float
                otherAccData:
                  type: array
                  items:
                    type: object
                    properties:
                      payload:
                        type: array
                        items:
                          type: array
                          items:
                            type: string
              additionalProperties: true
        required: true
      responses:
        "200":
          description: Updated
components:
  schemas:
    # here testing a few standard schema models.
    # They show all standard types:
    # (integer, double, float, string, array, object)
    Dog:
      type: object
      required:
        - bark
      properties:
        bark:
          type: boolean
        breed:
          type: string
    Cat:
      type: object
      properties:
        hunts:
          type: boolean
        age:
          type: integer
    Bunny:
      type: object
      required:
        - exporting-countries
      properties:
        weight:
          type: number
          format: double
        exporting-countries:
          type: array
          items:
            type: string
      additionalProperties: true
    Duck:
      type: object
      properties:
        bites:
          type: boolean
        family:
          type: object
          properties:
            countryOfOrigin:
              type: string
            count:
              type: number
              format: float
